<div class="page">

  <!-- Header -->

  <div class="page-header">

    <div>
      <h1>Farm Profile</h1>
      <p>Manage your farm information</p>
    </div>

    <button class="add-btn" (click)="openForm()">
      + Add Farm
    </button>

  </div>


  <!-- Add Farm Form -->

  <div class="form-box" *ngIf="showForm">

    <h2>Add New Farm</h2>

    <div class="form-grid">

      <div class="form-group">

        <label>Farm Name</label>

        <input
          type="text"
          [(ngModel)]="farmName"
          placeholder="Enter farm name">

      </div>


      <div class="form-group">

        <label>Owner Name</label>

        <input
          type="text"
          [(ngModel)]="ownerName"
          placeholder="Enter owner name">

      </div>


      <div class="form-group">

        <label>Location</label>

        <input
          type="text"
          [(ngModel)]="location"
          placeholder="Enter farm location">

      </div>


      <div class="form-group">

        <label>Total Area</label>

        <input
          type="number"
          [(ngModel)]="totalArea"
          placeholder="Example: 25.5">

      </div>


      <div class="form-group">

        <label>Area Unit</label>

        <input
          type="text"
          [(ngModel)]="areaUnit"
          placeholder="Example: Acre">

      </div>

    </div>


    <div class="form-buttons">

      <button
        class="save-btn"
        (click)="addFarm()">

        Save Farm

      </button>


      <button
        class="cancel-btn"
        (click)="closeForm()">

        Cancel

      </button>

    </div>

  </div>


  <!-- Farm Table -->

  <div class="farm-table">

    <table>

      <thead>

        <tr>
          <th>ID</th>
          <th>Farm Name</th>
          <th>Owner Name</th>
          <th>Location</th>
          <th>Total Area</th>
          <th>Area Unit</th>
        </tr>

      </thead>


      <tbody>

        <tr *ngIf="loading">

          <td colspan="6" class="message">
            Loading farm profiles...
          </td>

        </tr>


        <tr *ngFor="let farm of farmProfiles">

          <td>{{ farm.id }}</td>

          <td>{{ farm.farmName }}</td>

          <td>{{ farm.ownerName }}</td>

          <td>{{ farm.location }}</td>

          <td>{{ farm.totalArea }}</td>

          <td>{{ farm.areaUnit }}</td>

        </tr>


        <tr *ngIf="!loading && farmProfiles.length === 0">

          <td colspan="6" class="message">
            No farm profile records found
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
