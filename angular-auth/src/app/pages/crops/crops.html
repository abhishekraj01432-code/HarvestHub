<div class="page">

  <!-- Header -->
  <div class="page-header">

    <div>
      <h1>Crops</h1>
      <p>Manage your crops and crop information</p>
    </div>

    <button class="add-btn" (click)="openForm()">
      + Add Crop
    </button>

  </div>


  <!-- Add Crop Form -->
  <div class="form-box" *ngIf="showForm">

    <h2>Add New Crop</h2>

    <div class="form-grid">

      <!-- Crop Name -->
      <div class="form-group">

        <label>Crop Name</label>

        <input
          type="text"
          [(ngModel)]="cropName"
          placeholder="Enter crop name">

      </div>


      <!-- Crop Type -->
      <div class="form-group">

        <label>Crop Type</label>

        <input
          type="text"
          [(ngModel)]="cropType"
          placeholder="Enter crop type">

      </div>


      <!-- Season -->
      <div class="form-group">

        <label>Season</label>

        <input
          type="text"
          [(ngModel)]="season"
          placeholder="Example: Rabi">

      </div>


      <!-- Duration -->
      <div class="form-group">

        <label>Duration</label>

        <input
          type="text"
          [(ngModel)]="duration"
          placeholder="Example: 120 days">

      </div>

    </div>


     <!-- Form Buttons -->
    <div class="form-buttons">

      <button
        type="button"
        class="save-btn"
        (click)="addCrop()">
        Save Crop
      </button>

      <button
        type="button"
        class="cancel-btn"
        (click)="closeForm()">
        Cancel
      </button>

    </div>

  </div>

  <!-- Crop Table -->


  <!-- Crop Table -->
  <div class="crop-table">

    <table>

      <!-- Table Header -->
      <thead>

        <tr>

          <th>ID</th>
          <th>Crop Name</th>
          <th>Crop Type</th>
          <th>Season</th>
          <th>Duration</th>
          <th>Action</th>

        </tr>

      </thead>


<tbody>

  <!-- Loading -->
  <tr *ngIf="loading">

    <td colspan="6" class="message">
      Loading crops...
    </td>

  </tr>


  <!-- Crop Data -->
  <tr *ngFor="let crop of crops; let i = index">

    <!-- Serial Number -->
    <td>
      {{ i + 1 }}
    </td>

    <td>
      {{ crop.cropName }}
    </td>

    <td>
      {{ crop.cropType }}
    </td>

    <td>
      {{ crop.season }}
    </td>

    <td>
      {{ crop.duration }}
    </td>

    <!-- Delete Button -->
    <td>

      <button
        class="delete-btn"
        (click)="deleteCrop(crop.id)">

        Delete

      </button>

    </td>

  </tr>


  <!-- Empty Data -->
  <tr *ngIf="!loading && crops.length === 0">

    <td colspan="6" class="message">
      No crop records found
    </td>

  </tr>

</tbody>

    </table>

  </div>

</div>
