name: HarvestHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Check Backend
        working-directory: auth-backend
        run: |
          echo "Checking HarvestHub Backend..."
          test -f pom.xml

      - name: Build Backend
        working-directory: auth-backend
        run: mvn clean package -DskipTests


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: angular-auth/package-lock.json

      - name: Check Frontend
        working-directory: angular-auth
        run: |
          echo "Checking HarvestHub Frontend..."
          test -f package.json

      - name: Install Dependencies
        working-directory: angular-auth
        run: npm ci

      - name: Build Frontend
        working-directory: angular-auth
        run: npm run build


  project-check:
    name: Project Structure Check
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check HarvestHub Structure
        run: |
          echo "Checking HarvestHub project structure..."

          test -d angular-auth
          test -d auth-backend
          test -d Document
          test -d .github
          test -d .github/workflows
          test -f .github/workflows/harvesthub.yml

          echo "Angular frontend found"
          echo "Spring Boot backend found"
          echo "Documents folder found"
          echo ".github/workflows folder found"
          echo "HarvestHub project structure is valid."

      - name: Workflow Completed
        run: echo "HarvestHub CI completed successfully."